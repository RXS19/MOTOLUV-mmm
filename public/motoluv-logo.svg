<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="950" height="320" style="background:#000000;">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&amp;family=Orbitron:wght@800;900&amp;family=Barlow+Condensed:ital,wght@1,900&amp;family=Teko:wght@700&amp;display=swap");
      .moto-brand {
        font-family: 'Barlow Condensed', 'Orbitron', 'Montserrat', sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #FFFFFF;
        font-size: 135px;
        letter-spacing: 2px;
      }
      .luv-brand {
        font-family: 'Barlow Condensed', 'Orbitron', 'Montserrat', sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #FFFFFF;
        font-size: 135px;
        letter-spacing: 2px;
      }
      .sube-slogan {
        font-family: 'Orbitron', 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #E10600;
        font-size: 34px;
        letter-spacing: 12px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000" />

  <!-- MOTOLUV Brand Row -->
  <g transform="translate(475, 135)" text-anchor="middle">
    <!-- MOTO in White -->
    <text x="-40" y="38" class="moto-brand" text-anchor="end">MOTO</text>

    <!-- Red Pill Container behind LUV with slanted italic feel -->
    <rect x="-20" y="-85" width="370" height="150" rx="20" ry="20" fill="#E10600" />

    <!-- LUV in White inside the Red Pill -->
    <text x="165" y="38" class="luv-brand" text-anchor="middle">LUV</text>
  </g>

  <!-- Slogan: SUBE CONECTA RUEDA -->
  <text x="495" y="270" class="sube-slogan" text-anchor="middle">SUBE CONECTA RUEDA</text>
</svg>
