<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Subtle linear gradient for letters if needed or flat white -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2F5" />
    </linearGradient>
  </defs>

  <!-- Group with forward italic slant (-12 to -14 deg) -->
  <g transform="translate(45, 40)">
    <!-- Red pill badge for LUV -->
    <!-- Positioned around X=510, Y=0, Width=400, Height=170, rx=16 -->
    <rect x="510" y="0" width="400" height="170" rx="18" ry="18" fill="#E10600" />

    <!-- MOTOLUV Main Wordmark using skewed/styled paths -->
    <g transform="skewX(-14)">
      <!-- M -->
      <path d="M 50 155 L 75 20 L 115 20 L 145 95 L 175 20 L 215 20 L 190 155 L 155 155 L 168 75 L 140 145 L 120 145 L 92 75 L 80 155 Z" fill="url(#whiteGrad)" />
      
      <!-- O (First) with chamfered angular corners -->
      <path d="M 235 55 L 255 20 L 325 20 L 345 55 L 325 120 L 305 155 L 235 155 L 215 120 Z M 265 65 L 260 110 L 285 125 L 300 110 L 305 65 L 280 50 Z" fill="url(#whiteGrad)" fill-rule="evenodd" />

      <!-- T -->
      <path d="M 335 20 L 445 20 L 440 50 L 405 50 L 385 155 L 350 155 L 370 50 L 335 50 Z" fill="url(#whiteGrad)" />

      <!-- O (Second) with chamfered angular corners -->
      <path d="M 435 55 L 455 20 L 525 20 L 545 55 L 525 120 L 505 155 L 435 155 L 415 120 Z M 465 65 L 460 110 L 485 125 L 500 110 L 505 65 L 480 50 Z" fill="url(#whiteGrad)" fill-rule="evenodd" />

      <!-- L inside red badge -->
      <path d="M 590 20 L 625 20 L 602 125 L 670 125 L 665 155 L 565 155 Z" fill="#FFFFFF" />

      <!-- U inside red badge -->
      <path d="M 685 20 L 720 20 L 705 105 L 720 125 L 755 125 L 770 105 L 785 20 L 820 20 L 800 115 L 770 155 L 705 155 L 675 115 Z" fill="#FFFFFF" />

      <!-- V inside red badge -->
      <path d="M 830 20 L 865 20 L 880 110 L 910 110 L 925 20 L 960 20 L 915 155 L 870 155 Z" fill="#FFFFFF" />
    </g>

    <!-- SUBE CONECTA RUEDA -->
    <g transform="translate(455, 235)">
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        fill="#E10600" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="0.32em"
        style="text-transform: uppercase;"
      >SUBE CONECTA RUEDA</text>
    </g>
  </g>
</svg>
